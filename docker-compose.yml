services:
  db:
    image: postgres:16
    container_name: diario_db
    environment:
      POSTGRES_USER: diario
      POSTGRES_PASSWORD: diario123
      POSTGRES_DB: diario_emocional
    ports:
      - "5433:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: diario_redis
    ports:
      - "6379:6379"

volumes:
  datos_postgres:
